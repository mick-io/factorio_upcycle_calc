name: Deploy To Fly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly config inputs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "Missing required secret: FLY_API_TOKEN"
            exit 1
          fi
          if [ -z "$FLY_APP_NAME" ]; then
            echo "Missing required repo variable: FLY_APP_NAME"
            exit 1
          fi

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}
        run: flyctl deploy --config fly.toml --remote-only --app "$FLY_APP_NAME"
