app = "factorio-upcycle-calc"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"
