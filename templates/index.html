<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factorio Upcycle Calc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #f2efe7 0%, #ddd7c7 100%);
      padding: 2rem 1rem;
      font-family: "Press Start 2P", cursive;
      line-height: 1.6;
    }

    button,
    input,
    select,
    textarea {
      font-family: "Press Start 2P", cursive;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
    }

    .actions {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    #status {
      min-height: 1.25rem;
    }
  </style>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <main class="page">
    <section class="nes-container with-title is-rounded">
      <h1 class="title">HTMX + Go</h1>
      <h2>Factorio Upcycle Calc</h2>
      <p>Scaffold ready. Next step: add quality ratio and machine count inputs.</p>
      <div class="actions">
        <button
          hx-get="/healthz"
          hx-trigger="click"
          hx-target="#status"
          hx-swap="innerHTML"
          type="button"
          class="nes-btn is-primary"
        >
          Check server
        </button>
        <p id="status" class="nes-text is-success"></p>
      </div>
    </section>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
